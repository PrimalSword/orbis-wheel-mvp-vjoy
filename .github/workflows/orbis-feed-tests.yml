name: Orbis Feed tests

on:
  push:
    paths:
      - 'services/orbis-feed/**'
      - '.github/workflows/orbis-feed-tests.yml'
  pull_request:
    paths:
      - 'services/orbis-feed/**'
      - '.github/workflows/orbis-feed-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orbis-feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
