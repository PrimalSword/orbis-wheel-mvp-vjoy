[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-feed"
version = "0.1.0"
description = "Coletor local e resiliente de candles para o Orbis Trade"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Orbis Trade"}]
dependencies = []

[project.scripts]
orbis-feed = "orbis_feed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
